name: Python tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python 3.13 / Pillow 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
