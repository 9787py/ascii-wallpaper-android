name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0'

      - name: Build APK and run Android Lint
        env:
          BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          ./gradlew --no-daemon --console=plain \
            "-PbuildPython=$BUILD_PYTHON" assembleDebug lintDebug

      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/ascii-wallpaper-android-arm64-debug.apk
          cd dist
          sha256sum ascii-wallpaper-android-arm64-debug.apk > SHA256SUMS.txt

      - name: Save APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach APK to pre-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: android-debug
          path: dist

      - name: Create or update pre-release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --prerelease --latest=false \
              --title "$RELEASE_TAG - Android debug preview" \
              --notes "ARM64 debug APK built from tag $RELEASE_TAG. Build and Android Lint passed; device testing is still required. Debug signing keys may change between builds."
          fi
